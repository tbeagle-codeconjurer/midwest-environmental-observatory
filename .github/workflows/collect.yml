name: Collect weather and publish dashboard

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: observatory
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect environmental data
        working-directory: observatory-github
        run: python collect.py

      - name: Save collected data
        run: |
          git config user.name 'observatory-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add observatory-github/data/weather.json
          git diff --cached --quiet || git commit -m 'Update public weather observations'
          git push

      - uses: actions/configure-pages@v5

      - name: Prepare dashboard
        run: |
          mkdir -p site/data
          cp observatory-github/index.html site/
          cp observatory-github/data/weather.json site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
