name: Collect weather and publish dashboard
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: observatory
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare EPA archive
        working-directory: observatory-github
        run: |
          mkdir -p data
          if [ ! -f data/epa-xact.json ] && [ -f epa-xact.json ]; then cp epa-xact.json data/epa-xact.json; fi
      - name: Collect NOAA weather
        working-directory: observatory-github
        run: python collect.py
        continue-on-error: true
      - name: Collect EPA observations
        working-directory: observatory-github
        run: python collect_epa.py
        continue-on-error: true
      - name: Collect regional air quality and alerts
        working-directory: observatory-github
        run: python collect_region.py
        continue-on-error: true
      - name: Archive public communications
        working-directory: observatory-github
        run: python collect_comms.py
        continue-on-error: true
      - name: Collect national public monitoring
        working-directory: observatory-github
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python collect_national.py
        continue-on-error: true
      - name: Save public data
        run: |
          git config user.name 'observatory-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add observatory-github/data/
          git diff --cached --quiet || git commit -m 'Update public environmental observations'
          git push
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir -p site/data
          cp observatory-github/index.html site/index.html
          cp -r observatory-github/data/. site/data/
          test -f site/index.html
          ls -la site/data/
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: ./site
          retention-days: 7
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy observatory
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
