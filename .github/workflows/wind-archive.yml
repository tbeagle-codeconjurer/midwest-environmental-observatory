name: Collect regional wind archive
on:
  workflow_dispatch:
    inputs:
      cycle:
        description: 'GFS model initialization (UTC ISO timestamp)'
        default: '2026-11-25T12:00:00+00:00'
        required: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download weather grids
        env:
          CYCLE: ${{ inputs.cycle }}
        run: python collect_wind.py --run "$CYCLE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-wind-archive
          path: wind-data/
          retention-days: 90
